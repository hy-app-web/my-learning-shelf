<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#fff4f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="app.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>自分だけの教科書</title>
<style>
:root{color-scheme:light;--paper:#fff4f7;--ink:#35262d;--accent:#74354e;--line:#e8cdd7}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.7 system-ui,sans-serif}
main{width:min(100% - 36px,680px);margin:0 auto;padding:clamp(34px,7vw,77px) 0 max(48px,env(safe-area-inset-bottom))}
h1,h2{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;line-height:1.35;margin:0 0 12px}
h1{font-size:clamp(28px,7vw,48px)}h2{font-size:24px}header{border-bottom:2px solid var(--accent);padding-bottom:18px}
p{margin:0 0 12px}.muted,small{color:#66515b}.today{margin:22px 0 34px;padding:18px;background:#f7dfe8;border-radius:14px}.today h2{font-size:21px}
section.category{margin:0 0 28px}ul{list-style:none;margin:0;padding:0}li{border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 4px;min-height:46px;width:100%;text-align:left}
button{font:inherit;cursor:pointer}button.row{border:0;background:transparent;color:var(--ink);font-weight:600}button.row:hover{color:var(--accent);text-decoration:underline}
.badge{font-size:12px;font-weight:600;white-space:nowrap;color:var(--accent)}.planned .badge{color:#6e5662;font-weight:400}
article{margin-top:24px}article p{line-height:2}article h1{font-size:clamp(25px,6vw,39px)}.back{color:var(--accent);text-decoration:underline}.action{background:var(--accent);border:0;color:white;padding:11px 18px;border-radius:9px;margin-top:14px}.action[aria-pressed=true]{background:#f7dfe8;color:var(--accent)}footer{color:#66515b;font-size:13px}
:focus-visible{outline:2px solid #913b62;outline-offset:3px}
</style>
<script defer src="lessons.js"></script>
<script defer src="app.js"></script>
</head>
<body><main id="app"></main></body>
</html>
